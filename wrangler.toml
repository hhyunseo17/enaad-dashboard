name = "kt-ena-dashboard"
# main은 Workers 전용 키라 Pages Functions에는 적용되지 않는다(공식 문서 확인, 2026-09-15) —
# worker.js(현재 미배포, 향후 standalone Worker 전환 대비용)를 가리키는 것으로 그대로 둔다.
main = "worker.js"
compatibility_date = "2026-07-29"

# R2 버킷 바인딩 - bucket_name은 실제 사용 중인 R2 버킷 이름으로 변경하세요.
[[r2_buckets]]
binding = "DASHBOARD_BUCKET"
bucket_name = "adsales"

# 개인별 인증은 Supabase Auth(로그인 화면 + JWT)가 담당합니다 — Cloudflare Access 무료 플랜의
# 인증 사용자 50명 제한 때문에 옮겼습니다. Access(Zero Trust)를 IP 허용목록 정책으로 교체하는
# 작업은 Cloudflare 대시보드에서 별도로 진행 예정(레포 작업과 무관, 아직 미실행).

# Supabase 프록시(/api/*)용 secret — 절대 여기(wrangler.toml)에 평문으로 넣지 말 것.
# 아래 명령으로 등록:
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# (anon key가 아니라 service_role key. supabase/schema.sql이 anon/authenticated 권한을 전부 회수하므로
#  이 Worker만 service_role로 데이터를 읽을 수 있다. 요청의 Authorization: Bearer JWT는
#  SUPABASE_URL의 공개 JWKS 엔드포인트로 검증하므로 — shared/supabase-proxy.mjs 참고 — 별도
#  시크릿이 필요 없다.)

# --- Pages 배포용 설정 (실제 운영 경로 — GitHub 푸시 → Cloudflare Pages Git 연동 자동배포) -------
# Pages Git 빌드가 Functions 디렉터리(`functions/`)의 함수를 사용합니다.
# project_name은 Pages 하위 도메인(project_name.pages.dev)에 사용됩니다.
project_name = "enaad"
# account_id = "YOUR_ACCOUNT_ID"  # ← wrangler CLI로 직접 배포할 때만 필요(현재 Git 연동 자동배포라 불필요)

# pages_build_output_dir이 있어야 Cloudflare Pages가 이 파일을 Pages 설정의 소스로 확실히 인식한다
# (공식 문서: 이 필드 없이는 Pages가 위 [[r2_buckets]] 같은 바인딩을 대시보드 설정과 다르게 처리할 수
# 있다 — 2026-09-15, 대시보드에 DASHBOARD_BUCKET을 정확히 설정했는데도 Pages Function이
# env.DASHBOARD_BUCKET을 못 읽는 문제의 원인으로 확인). 빌드 도구 없이 정적 파일이 저장소 루트에
# 그대로 있으므로(README 참고) 출력 디렉터리는 저장소 루트 자체다.
pages_build_output_dir = "."
# --------------------------------------------------------------------
